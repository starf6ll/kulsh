[project]
name = "kulsh"
version = "2.47.0"
description = "Kulsh GPT - Multifunctional AI bot for Telegram and Discord"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pyTelegramBotAPI>=4.15.0",
    "discord.py>=2.4.0",
    "PyNaCl>=1.5.0",
    "discord-ext-voice-recv>=0.4.0",
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.1",
    "edge-tts>=7.0.0",
    "python-socketio>=5.11.0",
    "Pillow>=10.0.0",
    "deep-translator>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",
    "mypy>=1.8.0",
    "types-aiohttp",
    "types-python-dotenv",
    "types-PyNaCl",
]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = "venv"
include = ["kulsh.py", "src"]
exclude = ["venv/**", ".venv/**"]
typeCheckingMode = "strict"
reportMissingImports = true
stubPath = "stubs/vendor"

[tool.mypy]
python_version = "3.14"
files = ["kulsh.py", "src"]
exclude = ["venv", ".venv", "stubs/telebot"]
mypy_path = "stubs/vendor"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
strict_equality = true
strict_concatenate = true
strict = true


[project.scripts]
kulsh = "src.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
